[project]
name = "bnet_simulator"
version = "0.1.0"
description = "Discrete-event simulator for comparing beacon-scheduling and multihop strategies in a buoy network"
readme = "README.md"
authors = [
    { name = "CesareDev", email = "corsicesare.lavoro@gmail.com" },
    { name = "LuPierba", email = "filo.pierbatti3@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.3",
    "pandas>=2.2.3",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
]

[project.scripts]
sim = "run:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Tests import the source packages (config, buoys, core, ...) the same way the
# scripts do, so the src/ root must be on sys.path.
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
sources = ["src"]
