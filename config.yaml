simulation:
  schedulers:
  - static
  # - dynamic_adab
  # - dynamic_acab
  min_buoys: 20
  max_buoys: 100
  step_buoys: 20
  intervals:
   - 1.0   
   - 0.5
   - 0.25
  duration: 120
  num_processes: 10
  ideal_channel: true
  # Options: static, ramp, random
  scenario: random          
  # Percentage of buoys that can change per update in random scenario 
  random_variability: 0.10
  enable_metrics: true
  enable_logging: false
  enable_file_logging: false
  # Options: none, append, forwarded
  multihop_mode: forwarded
  # Multihop modes swept and compared per run (subset of: none, append, forwarded)
  multihop_modes:
  # - none
  - append
  - forwarded
  # Maximum hops for forwarded mode
  multihop_limit: 1
  # Append mode: discovered nodes farther than this many hops from the sender are
  # not advertised in its beacons (1 = direct neighbors only, 0 = unlimited)
  append_hop_limit: 2
  # Maximum number of beacons that can be stored in pending queue
  pending_queue_limit: 20
  # Probabilistic forwarding: queue a received beacon with p = min(1, n0/n_neighbors)
  forward_density_baseline: 5

world:
  width: 500.0
  height: 500.0

buoys:
  mobile_percentage: 0.4
  default_velocity: 15.0
  # m/s – lower bound per leg
  rwp_speed_min: 5.0 
  # m/s – upper bound per leg   
  rwp_speed_max: 20.0
  # seconds – minimum pause at waypoint
  rwp_pause_min: 0.0
  # seconds – maximum pause at waypoint
  rwp_pause_max: 10.0

network:
  bit_rate: 1000000
  speed_of_light: 300000000.0
  communication_range_max: 80.0
  communication_range_high_prob: 70.0
  delivery_prob_high: 0.9
  delivery_prob_low: 0.15

csma:
  slot_time: 2.0e-05
  difs_time: 5.0e-05
  cw: 16

scheduler:
  static_interval: 1.0
  beacon_min_interval: 1.0
  beacon_max_interval: 5.0
  neighbor_timeout: 7.0
  # ADAB: neighbour count that maps to density factor = 1.0 (full backoff)
  adab_neighbors_threshold: 15.0
  # ACAB: neighbour count that maps density component to 1.0
  acab_neighbors_threshold: 10.0
  # ACAB: seconds since last contact at which contact-recency score decays to 0
  acab_contact_threshold: 20.0
  # ACAB blend weights: [density, contact, mobility] — must sum to 1.0
  acab_weights: [0.4, 0.3, 0.3]
