<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Trigger della pipeline di trasmissione di una boa</title>
<desc>Diagramma di flusso che mostra i due punti di ingresso della pipeline CSMA di una boa: lo SCHEDULER_CHECK periodico per il beacon proprio, e la RECEPTION di un beacon altrui in modalita forwarded che puo generare un inoltro in coda.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a;}
.th{font-size:14px;font-weight:bold;}
.t{font-size:14px;}
.ts{font-size:12px;fill:#555;}
.box{fill:#f1efe8;stroke:#888780;stroke-width:0.5;}
.blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5;}
.blueText{fill:#0C447C;}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5;}
.coralText{fill:#712B13;}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.grayText{fill:#444441;}
.line{stroke:#3d3d3a;stroke-width:0.5;fill:none;}
</style>

<text class="th" x="40" y="32">Trigger A — beacon proprio (tutte le modalita)</text>
<rect class="blue" x="40" y="50" width="200" height="56" rx="8"/>
<text class="th blueText" x="140" y="73" text-anchor="middle">SCHEDULER_CHECK</text>
<text class="ts blueText" x="140" y="91" text-anchor="middle">evento periodico</text>
<line class="line" x1="140" y1="106" x2="140" y2="136" marker-end="url(#arrow)"/>

<rect class="gray" x="40" y="136" width="200" height="56" rx="8"/>
<text class="th grayText" x="140" y="159" text-anchor="middle">want_to_send?</text>
<text class="ts grayText" x="140" y="177" text-anchor="middle">gia in attesa di invio</text>
<text class="ts" x="252" y="158">si</text>
<line class="line" x1="240" y1="164" x2="300" y2="164" marker-end="url(#arrow)"/>
<rect class="gray" x="300" y="140" width="140" height="44" rx="8"/>
<text class="th grayText" x="370" y="166" text-anchor="middle">ignora</text>

<text class="ts" x="150" y="212">no</text>
<line class="line" x1="140" y1="192" x2="140" y2="226" marker-end="url(#arrow)"/>

<rect class="gray" x="40" y="226" width="200" height="56" rx="8"/>
<text class="th grayText" x="140" y="249" text-anchor="middle">scheduler.should_send()</text>
<text class="ts grayText" x="140" y="267" text-anchor="middle">in base a densita/mobilita</text>

<text class="ts" x="150" y="298">si</text>
<line class="line" x1="140" y1="282" x2="140" y2="312" marker-end="url(#arrow)"/>

<rect class="blue" x="40" y="312" width="200" height="56" rx="8"/>
<text class="th blueText" x="140" y="335" text-anchor="middle">want_to_send = true</text>
<text class="ts blueText" x="140" y="353" text-anchor="middle">registra decision_time</text>
<line class="line" x1="140" y1="368" x2="140" y2="398" marker-end="url(#arrow)"/>

<rect class="blue" x="40" y="398" width="200" height="56" rx="8"/>
<text class="th blueText" x="140" y="421" text-anchor="middle">processing?</text>
<text class="ts blueText" x="140" y="439" text-anchor="middle">pipeline gia attiva</text>

<text class="ts" x="150" y="470">no</text>
<line class="line" x1="140" y1="454" x2="140" y2="484" marker-end="url(#arrow)"/>
<rect class="blue" x="40" y="484" width="200" height="44" rx="8"/>
<text class="th blueText" x="140" y="510" text-anchor="middle">avvia CHANNEL_SENSE</text>

<text class="ts" x="252" y="412">si</text>
<line class="line" x1="240" y1="420" x2="290" y2="420" marker-end="url(#arrow)"/>
<rect class="gray" x="290" y="396" width="200" height="48" rx="8"/>
<text class="ts grayText" x="390" y="416" text-anchor="middle">nessuna nuova pipeline:</text>
<text class="ts grayText" x="390" y="432" text-anchor="middle">la pipeline attiva lo invia</text>

<rect class="coral" x="380" y="50" width="260" height="40" rx="8"/>
<text class="th coralText" x="510" y="74" text-anchor="middle">Trigger B — solo modalita forwarded</text>
<line class="line" x1="510" y1="90" x2="510" y2="120" marker-end="url(#arrow)"/>

<rect class="coral" x="410" y="120" width="200" height="56" rx="8"/>
<text class="th coralText" x="510" y="143" text-anchor="middle">RECEPTION</text>
<text class="ts coralText" x="510" y="161" text-anchor="middle">beacon ricevuto</text>
<line class="line" x1="510" y1="176" x2="510" y2="206" marker-end="url(#arrow)"/>

<rect class="coral" x="410" y="206" width="200" height="64" rx="8"/>
<text class="th coralText" x="510" y="227" text-anchor="middle">hop_limit&gt;0, non mio</text>
<text class="ts coralText" x="510" y="245" text-anchor="middle">e piu recente per</text>
<text class="ts coralText" x="510" y="261" text-anchor="middle">questo origin_id?</text>

<text class="ts" x="630" y="244">no</text>
<line class="line" x1="610" y1="238" x2="660" y2="238"/>
<path class="line" d="M660 238 L660 296" marker-end="url(#arrow)"/>
<line class="line" x1="660" y1="296" x2="610" y2="296" marker-end="url(#arrow)"/>
<rect class="gray" x="420" y="278" width="190" height="36" rx="8"/>
<text class="ts grayText" x="515" y="300" text-anchor="middle">solo bookkeeping</text>

<text class="ts" x="520" y="298">si</text>
<line class="line" x1="510" y1="270" x2="510" y2="338" marker-end="url(#arrow)"/>

<rect class="coral" x="410" y="338" width="200" height="56" rx="8"/>
<text class="th coralText" x="510" y="361" text-anchor="middle">should_forward()?</text>
<text class="ts coralText" x="510" y="379" text-anchor="middle">gate di densita</text>

<text class="ts" x="650" y="362">no</text>
<line class="line" x1="610" y1="360" x2="660" y2="360"/>
<path class="line" d="M660 360 L660 430" marker-end="url(#arrow)"/>
<line class="line" x1="660" y1="430" x2="610" y2="430" marker-end="url(#arrow)"/>
<rect class="gray" x="420" y="412" width="190" height="36" rx="8"/>
<text class="ts grayText" x="515" y="434" text-anchor="middle">scarta beacon</text>

<text class="ts" x="520" y="412">si</text>
<line class="line" x1="510" y1="394" x2="510" y2="468" marker-end="url(#arrow)"/>

<rect class="coral" x="410" y="468" width="200" height="56" rx="8"/>
<text class="th coralText" x="510" y="491" text-anchor="middle">accoda in pending</text>
<text class="ts coralText" x="510" y="509" text-anchor="middle">forward_beacons</text>

<text class="ts" x="510" y="544" text-anchor="middle">se processing=false, jitter + CHANNEL_SENSE</text>
</svg>
