<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline CSMA condivisa di una boa</title>
<desc>Diagramma di flusso della catena CHANNEL_SENSE, DIFS_COMPLETION, BACKOFF_COMPLETION, TRANSMISSION_START, comune a tutte le modalita, con il ciclo di re-contesa quando restano beacon di forward in coda.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="660" fill="#ffffff"/>

<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a;}
.th{font-size:14px;font-weight:bold;}
.ts{font-size:12px;fill:#555;}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.grayText{fill:#444441;}
.blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5;}
.blueText{fill:#0C447C;}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5;}
.coralText{fill:#712B13;}
.line{stroke:#3d3d3a;stroke-width:0.5;fill:none;}
</style>

<rect class="blue" x="220" y="30" width="200" height="44" rx="8"/>
<text class="th blueText" x="320" y="56" text-anchor="middle">CHANNEL_SENSE</text>
<line class="line" x1="320" y1="74" x2="320" y2="104" marker-end="url(#arrow)"/>

<rect class="gray" x="220" y="104" width="200" height="56" rx="8"/>
<text class="th grayText" x="320" y="127" text-anchor="middle">canale libero?</text>
<text class="ts grayText" x="320" y="145" text-anchor="middle">channel_is_busy()</text>

<text class="ts" x="450" y="116">occupato</text>
<line class="line" x1="420" y1="124" x2="500" y2="124"/>
<path class="line" d="M500 124 L500 18 L320 18" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="60" text-anchor="middle">riprova quando si libera</text>

<text class="ts" x="330" y="180">libero</text>
<line class="line" x1="320" y1="160" x2="320" y2="206" marker-end="url(#arrow)"/>

<rect class="blue" x="220" y="206" width="200" height="56" rx="8"/>
<text class="th blueText" x="320" y="229" text-anchor="middle">DIFS_COMPLETION</text>
<text class="ts blueText" x="320" y="247" text-anchor="middle">dopo attesa difs_time</text>
<line class="line" x1="320" y1="262" x2="320" y2="292" marker-end="url(#arrow)"/>

<rect class="gray" x="220" y="292" width="200" height="44" rx="8"/>
<text class="th grayText" x="320" y="318" text-anchor="middle">canale ancora libero?</text>

<text class="ts" x="450" y="304">occupato</text>
<line class="line" x1="420" y1="312" x2="540" y2="312"/>
<path class="line" d="M540 312 L540 124 L420 124" marker-end="url(#arrow)"/>
<text class="ts" x="545" y="220" text-anchor="middle" transform="rotate(-90 545 220)">torna a CHANNEL_SENSE</text>

<text class="ts" x="330" y="356">libero</text>
<line class="line" x1="320" y1="336" x2="320" y2="372" marker-end="url(#arrow)"/>

<rect class="blue" x="220" y="372" width="200" height="56" rx="8"/>
<text class="th blueText" x="320" y="395" text-anchor="middle">backoff casuale</text>
<text class="ts blueText" x="320" y="413" text-anchor="middle">slot in [0, cw-1]</text>
<line class="line" x1="320" y1="428" x2="320" y2="458" marker-end="url(#arrow)"/>

<rect class="blue" x="220" y="458" width="200" height="44" rx="8"/>
<text class="th blueText" x="320" y="484" text-anchor="middle">BACKOFF_COMPLETION</text>
<line class="line" x1="320" y1="502" x2="320" y2="532" marker-end="url(#arrow)"/>

<rect class="gray" x="220" y="532" width="200" height="44" rx="8"/>
<text class="th grayText" x="320" y="558" text-anchor="middle">canale ancora libero?</text>

<text class="ts" x="455" y="538">occupato: backoff</text>
<text class="ts" x="455" y="552">scartato, ricomincia</text>
<line class="line" x1="420" y1="554" x2="580" y2="554"/>
<path class="line" d="M580 554 L580 124 L420 124" marker-end="url(#arrow)"/>

<text class="ts" x="330" y="596">libero</text>
<line class="line" x1="320" y1="576" x2="320" y2="612" marker-end="url(#arrow)"/>

<rect class="coral" x="200" y="612" width="240" height="44" rx="8"/>
<text class="th coralText" x="320" y="638" text-anchor="middle">TRANSMISSION_START</text>
</svg>
